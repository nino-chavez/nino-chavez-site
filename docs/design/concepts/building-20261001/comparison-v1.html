<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Building — Design comparison</title><style>
@font-face{font-family:Body;src:url('/public/fonts/inter-latin.woff2')}*{box-sizing:border-box}body{margin:0;background:#e5e0d7;color:#122a3c;font:14px Body,Arial,sans-serif}.controls{padding:14px 24px 12px;background:#faf7f1;border-bottom:1px solid #bbc0bf}.controls-top{display:flex;justify-content:space-between;align-items:center;gap:18px}.controls-top p{margin:0}.concepts{display:flex;gap:8px}button,a{font:inherit;color:inherit}button{cursor:pointer;border:1px solid #bbc0bf;background:transparent;border-radius:3px;min-height:42px;padding:8px 15px}button[aria-pressed=true]{background:#122a3c;color:#fff;border-color:#122a3c}.sizes{display:flex;gap:6px}.note{display:flex;justify-content:space-between;align-items:center;gap:20px;padding-top:10px;font-size:12px;color:#536373}.note p{margin:0}.note a{white-space:nowrap;text-underline-offset:3px}.viewport{height:calc(100vh - 116px);overflow:hidden;position:relative}iframe{display:block;position:absolute;top:0;border:0;background:#f4f0e8;transform-origin:top left}button:focus-visible,a:focus-visible{outline:3px solid #0d5a93;outline-offset:3px}@media(max-width:800px){.controls{padding:10px 12px}.controls-top{flex-wrap:wrap;gap:8px}.concepts{order:2;width:100%}.concepts button{flex:1;font-size:12px;padding:7px}.note{gap:8px}.note p{font-size:11px}.viewport{padding:0;height:calc(100vh - 164px)}.controls-top>p{font-size:12px}.sizes button{font-size:12px;min-height:36px;padding:6px 10px}}
</style></head><body><header class="controls"><div class="controls-top"><p><strong>Building</strong> · Local design concepts</p><nav class="concepts" aria-label="Choose a concept"><button data-concept="a">A · Product gallery</button><button data-concept="b">B · Project browser</button><button data-concept="c">C · By purpose</button></nav><div class="sizes" aria-label="Preview size"><button data-size="desktop">Desktop</button><button data-size="phone">Phone</button></div></div><div class="note"><p id="description"></p><a id="open" target="_blank">Open full page</a></div></header><div class="viewport"><iframe id="preview" title="Building design preview"></iframe></div><script>
const descriptions={a:'Scan the products visually. Separate previews, compact tools, and a distinct area for studies.',b:'Compare six products in one place. Select a name to inspect its screen, purpose, availability, and link.',c:'Explore by purpose: everyday software, volleyball, and tools for making and sharing.'};
function show(){const q=new URLSearchParams(location.search);const concept=['a','b','c'].includes(q.get('concept'))?q.get('concept'):'c';const size=q.get('size')==='phone'?'phone':'desktop';document.querySelectorAll('[data-concept]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.concept===concept)));document.querySelectorAll('[data-size]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.size===size)));const frame=document.querySelector('iframe');if(frame.dataset.concept!==concept){frame.src=concept+'.html';frame.dataset.concept=concept}frame.className=size;document.querySelector('#description').textContent=descriptions[concept];document.querySelector('#open').href=concept+'.html';sizePreview();}
function sizePreview(){const area=document.querySelector('.viewport'),frame=document.querySelector('iframe');const width=frame.className==='phone'?390:1440,scale=Math.min(1,area.clientWidth/width);frame.style.width=width+'px';frame.style.height=(frame.className==='phone'?Math.min(844,area.clientHeight/scale):area.clientHeight/scale)+'px';frame.style.left=Math.max(0,(area.clientWidth-width*scale)/2)+'px';frame.style.transform='scale('+scale+')'}
new ResizeObserver(sizePreview).observe(document.querySelector('.viewport'));
document.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{const q=new URLSearchParams(location.search);q.set(b.dataset.concept?'concept':'size',b.dataset.concept||b.dataset.size);history.pushState(null,'','?'+q);show()}));window.addEventListener('popstate',show);show();
</script></body></html>
