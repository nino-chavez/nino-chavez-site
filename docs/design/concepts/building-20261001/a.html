<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Building — Product gallery concept</title><link rel="stylesheet" href="shared.css"><link rel="stylesheet" href="a.css"></head><body><div id="site-header"></div><main id="main"><header class="page-opening wrap"><div><h1>Building</h1><p>Products I build and run, plus public studies and guides.</p></div><div id="top-archive" data-top-archive></div></header><div id="overview"><section class="gallery-section wrap" aria-labelledby="products-title"><div class="gallery-heading"><h2 id="products-title">Products</h2><a href="#more-projects">More projects <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v15m-6-6 6 6 6-6"/></svg></a></div><div class="product-gallery" id="product-gallery"></div></section><section class="more-projects wrap" id="more-projects" aria-labelledby="more-title"><div class="section-heading"><h2 id="more-title">More projects</h2><p>Tools for making, thinking, and sharing work.</p></div><div class="more-grid" id="more-grid"></div></section><div id="study-area"></div><div id="further-area"></div></div><section id="catalogue" class="catalogue" hidden></section></main><div id="site-footer"></div><script src="data.js"></script><script src="shared.js"></script><script>
const B=Building;
document.querySelector('#top-archive').innerHTML=B.archiveTrigger();
document.querySelector('#product-gallery').innerHTML=B.data.products.slice(0,3).map(p=>`<article class="gallery-product">${B.media(p)}<div class="gallery-copy"><div class="product-name"><h3>${B.esc(p.name)}</h3></div><p class="status">${B.esc(p.availability)}</p><p class="summary">${B.esc(p.summary)}</p>${B.link(p)}${B.caption(p)}</div></article>`).join('');
document.querySelector('#more-grid').innerHTML=B.data.products.slice(3).map(B.smallProduct).join('');
document.querySelector('#study-area').innerHTML=B.studies();
document.querySelector('#further-area').innerHTML=B.further();
B.mount();
</script></body></html>
