<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Nino Chavez — Home concept</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body data-page="home">
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header" id="site-header"></header>
    <main id="main" tabindex="-1">
      <section class="intro shell" aria-labelledby="page-title" id="intro"></section>
      <section class="work shell" aria-labelledby="work-title">
        <div class="section-head">
          <h2 id="work-title">Selected work</h2>
          <span id="all-work-link"></span>
        </div>
        <div class="project-grid" id="project-grid"></div>
      </section>
      <section class="about-band shell" aria-labelledby="about-title" id="about"></section>
    </main>
    <footer class="site-footer shell" id="site-footer"></footer>
    <script type="module" src="app.js"></script>
  </body>
</html>
