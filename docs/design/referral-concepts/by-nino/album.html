<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>College Women's VB - Millikin at North Central - 09-23-2026 — Nino Chavez Photography</title>
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="gallery-page album-page">
  <a class="skip-link" href="#photos">Skip to all photos</a>
  <header class="site-header gallery-site-header">
    <a class="site-name" href="https://ninochavez.co/">Nino Chavez</a>
    <nav aria-label="Nino Chavez" data-site-nav></nav>
    <button class="site-menu" type="button" data-site-menu>Menu</button>
  </header>

  <main>
    <section class="photo-identity" aria-label="Nino Chavez Photography">
      <a href="https://ninochavez.co/photography">Photography</a>
    </section>

    <section class="album-opening">
      <div class="album-intro">
        <p class="album-sport">College women’s volleyball</p>
        <h1>Millikin at North Central</h1>
        <p class="album-date">September 23, 2026</p>
        <div class="album-credits">
          <span>43 photographs</span>
          <span>By Nino Chavez</span>
        </div>
        <div class="album-actions">
          <a class="album-live-link" href="#photos">Browse photos</a>
          <button class="copy-link" type="button" data-copy-album>Copy album link</button>
        </div>
        <p class="copy-status" data-copy-status aria-live="polite"></p>
      </div>
      <button class="album-hero" type="button" data-hero-photo aria-label="Open huddle photograph">
        <img src="https://imagedelivery.net/wg34HB28-JkySWVm5fW4kA/DWdCET-DSC09434/grid" alt="Players in light blue and red uniforms huddle together on a court.">
      </button>
    </section>

    <section class="album-collection" id="photos" aria-labelledby="photos-title">
      <div class="collection-heading">
        <div>
          <h2 id="photos-title">All photographs</h2>
          <p>Search photo numbers or descriptions to find a moment.</p>
        </div>
        <p class="gallery-count" data-photo-results-label>43 photos</p>
      </div>
      <div class="search-row">
        <label for="photo-search">Find a photograph</label>
        <input id="photo-search" class="gallery-search" type="search" data-photo-search placeholder="Try DSC09426 or huddle" autocomplete="off">
        <p class="search-result" data-photo-results aria-live="polite">43 photos</p>
      </div>
      <div class="photo-grid album-grid" data-photo-grid></div>
    </section>
  </main>

  <footer class="preview-return"><a href="../comparison.html">Design preview</a></footer>
  <script src="../shared/content.js" defer></script>
  <script src="../shared/interactions.js" defer></script>
</body>
</html>
