name: Deploy site

# Deploy-on-push for the ninochavez.co Worker (`ninochavez-main-open-practice`).
# Replaces the manual `npm run deploy:production` steady state that let the live
# site drift from `main` silently (pushes 2026-08-05 → 2026-08-12 sat
# unpublished because the only auto-build was the vestigial Pages project).
#
# Live since 2026-10-07. The secrets come from 1Password (see DEPLOY.md
# § Credentials). Without them the gate below skips the deploy with a notice and
# the run stays green, so a missing secret never red-X's the repo. A green run
# is therefore not proof of a deploy: check that the deploy step ran.
#   CLOUDFLARE_API_TOKEN   — needs at least Account · Workers Scripts : Edit
#   CLOUDFLARE_ACCOUNT_ID  — the account that owns the Worker
#
# Alternative (even less to maintain): connect this repo to the existing Worker
# via Workers Builds (dashboard → Worker → Settings → Builds; build command
# `npm run build`, deploy command `npx wrangler deploy`) per DEPLOY.md — that
# connection is dashboard-only (the builds API rejects API tokens and wrangler
# OAuth tokens alike, verified 2026-08-12). Pick one mechanism, not both.
#
# The `navigation` job runs the Playwright navigation suite (e2e/navigation:
# library search, mobile menu, the Building catalogue) on every pull request
# and before every deploy; `deploy` waits for it. It needs no secrets, so it is
# deliberately outside the credential gate: a skipped suite would leave the run
# green. Pull requests run the suite only; the deploy job never runs for them.
# The pull_request trigger has no path filter, so a spec-only change still runs
# the suite. The ruleset does not require this check yet, so a red PR can still
# be merged by hand; the deploy will then refuse to ship it.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '_archive/**'
      - 'e2e/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  navigation:
    name: Navigation suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # Only the browsers the two projects use: iphone-webkit, mobile-chromium.
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit

      # Builds, then serves the build with `npm start` (vite preview on 4318).
      - name: Build and run the navigation suite
        run: npm run test:navigation -- --reporter=list,github

      - if: failure()
        name: Upload failure traces and screenshots
        uses: actions/upload-artifact@v4
        with:
          name: navigation-test-results
          path: outputs/navigation-tests
          retention-days: 14

  deploy:
    needs: navigation
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Gate on Cloudflare credentials
        id: gate
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Cloudflare secrets not set — deploy is dormant. Add CLOUDFLARE_API_TOKEN (Workers Scripts:Edit) + CLOUDFLARE_ACCOUNT_ID (repo Settings → Secrets) to enable, or connect Workers Builds in the dashboard instead."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v4

      - if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - if: steps.gate.outputs.ready == 'true'
        name: Install
        run: npm ci

      # Preflight per DEPLOY.md. `npm test` builds first; sync:content falls
      # back to the published writing/demo indexes when sibling checkouts are
      # absent, so the CI build needs no extra repos.
      - if: steps.gate.outputs.ready == 'true'
        name: Check
        run: npm run check

      - if: steps.gate.outputs.ready == 'true'
        name: Test
        run: npm test

      - if: steps.gate.outputs.ready == 'true'
        name: Deploy Worker (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:production
