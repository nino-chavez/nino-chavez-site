name: Deploy site

# Deploy-on-push for the ninochavez.co Worker (`ninochavez-main-open-practice`).
# Replaces the manual `npm run deploy:production` steady state that let the live
# site drift from `main` silently (pushes 2026-08-05 → 2026-08-12 sat
# unpublished because the only auto-build was the vestigial Pages project).
#
# DORMANT until secrets are set — it runs green and SKIPS the deploy steps (with
# a notice) when the Cloudflare credentials are absent, so adding this file does
# not red-X the repo. To enable, add two repo secrets (Settings → Secrets and
# variables → Actions):
#   CLOUDFLARE_API_TOKEN   — a token with Account · Workers Scripts : Edit
#   CLOUDFLARE_ACCOUNT_ID  — the account that owns the Worker
#
# Alternative (even less to maintain): connect this repo to the existing Worker
# via Workers Builds (dashboard → Worker → Settings → Builds; build command
# `npm run build`, deploy command `npx wrangler deploy`) per DEPLOY.md — that
# connection is dashboard-only (the builds API rejects API tokens and wrangler
# OAuth tokens alike, verified 2026-08-12). Pick one mechanism, not both.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '_archive/**'
      - 'e2e/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Gate on Cloudflare credentials
        id: gate
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Cloudflare secrets not set — deploy is dormant. Add CLOUDFLARE_API_TOKEN (Workers Scripts:Edit) + CLOUDFLARE_ACCOUNT_ID (repo Settings → Secrets) to enable, or connect Workers Builds in the dashboard instead."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v4

      - if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - if: steps.gate.outputs.ready == 'true'
        name: Install
        run: npm ci

      # Preflight per DEPLOY.md. `npm test` builds first; sync:content falls
      # back to the published writing/demo indexes when sibling checkouts are
      # absent, so the CI build needs no extra repos.
      - if: steps.gate.outputs.ready == 'true'
        name: Check
        run: npm run check

      - if: steps.gate.outputs.ready == 'true'
        name: Test
        run: npm test

      - if: steps.gate.outputs.ready == 'true'
        name: Deploy Worker (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:production
